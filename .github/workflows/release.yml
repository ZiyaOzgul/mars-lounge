name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Windows ve macOS ayri kosucularda derleniyor: electron-builder bir
    # platformun kurulum dosyasini yalnizca o platformda uretebiliyor.
    # max-parallel: 1 - iki is ayni GitHub release'ini olusturmaya
    # calisip birbiriyle yarismasin, ikincisi mevcut release'e eklesin.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build and publish Electron app
        run: npx electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS derlemesi IMZALANMIYOR: Apple Developer hesabi yok.
          # electron-builder kosucuda rastgele bir imza aramasin diye
          # kapatiyoruz (package.json'da mac.identity = null ile birlikte).
          CSC_IDENTITY_AUTO_DISCOVERY: false
